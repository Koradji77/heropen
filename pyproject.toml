[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heropen"
version = "1.9.4"
description = "heropen — AI Agent Long-term Memory System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "KSMN Studio", email = "akoken@163.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Pure-Python MCP runtime; required by `heropen mcp` / `heropen-mcp`.
    # mcp 2.x renamed FastMCP → MCPServer and moved modules — pin <2 until we adapt.
    # Keep native vector engine (fastembed/onnxruntime) optional for ARM ports.
    "mcp>=1.6,<2",
]

[project.optional-dependencies]
embedding = [
    "fastembed>=0.6",
]
ui = [
    "rich>=13.0",
]
all = [
    "heropen[embedding]",
    "heropen[ui]",
    "mcp>=1.6,<2",
]

[project.scripts]
heropen = "heropen.cli:main"
heropen-mcp = "heropen.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heropen"]

[tool.hatch.build.targets.wheel.force-include]
"src/heropen/heropen_auto_setup.pth" = "heropen_auto_setup.pth"

[project.urls]
Homepage = "https://heropen.net"
Documentation = "https://heropen.net/heropen/docs/"
Repository = "https://github.com/Koradji77/heropen"
