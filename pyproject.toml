[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "heropen"
version = "2.0.6"
description = "heropen — AI Agent Long-term Memory System"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "KSMN Studio", email = "heropen@agent.qq.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    # Pure-Python MCP runtime; required by `heropen mcp` / `heropen-mcp`.
    # mcp 2.x renamed FastMCP → MCPServer and moved modules — pin <2 until we adapt.
    "mcp>=1.6,<2",
    # Windows tray badge. The badge is the entry point to the graphical workbench
    # and the per-turn save modes, so it must be present after a plain
    # `pip install heropen` — not hidden behind an extra. Guarded by
    # platform_system so non-Windows installs (macOS / Linux / ARM) stay lean
    # and keep building, since pystray/Pillow are only used on Windows.
    'pystray>=0.19; platform_system == "Windows"',
    'Pillow>=10; platform_system == "Windows"',
]

[project.optional-dependencies]
embedding = [
    "fastembed>=0.6",
]
ui = [
    "rich>=13.0",
]
tray = [
    "pystray>=0.19",
    "Pillow>=10",
]
all = [
    "heropen[embedding]",
    "heropen[ui]",
    "heropen[tray]",
    "mcp>=1.6,<2",
]

[project.scripts]
heropen = "heropen.cli:main"
heropen-mcp = "heropen.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/heropen"]

[tool.hatch.build.targets.wheel.force-include]
"src/heropen/heropen_auto_setup.pth" = "heropen_auto_setup.pth"

# Scratch dirs (_tmp_*) are local-only; keep them out of the sdist even if the
# VCS ignore rules are unavailable (e.g. building from an exported tarball).
[tool.hatch.build.targets.sdist]
exclude = [
  "/_tmp_*",
]

[project.urls]
Homepage = "https://heropen.net"
Documentation = "https://heropen.net/docs/"
Repository = "https://github.com/Koradji77/heropen"
